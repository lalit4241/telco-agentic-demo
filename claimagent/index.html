<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClaimAgent: AI claims copilot for Guidewire ClaimCenter</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2032%2032'%3E%3Crect%20rx%3D'6'%20width%3D'32'%20height%3D'32'%20fill%3D'%230e7c86'%2F%3E%3Ctext%20x%3D'16'%20y%3D'22'%20text-anchor%3D'middle'%20font-family%3D'Segoe%20UI%2Csans-serif'%20font-size%3D'14'%20font-weight%3D'700'%20fill%3D'white'%3ECA%3C%2Ftext%3E%3C%2Fsvg%3E">
<style>:root{--navy:#0b2a4a;--navy2:#123a63;--teal:#0e7c86;--teal-l:#e3f3f4;--bg:#eef1f5;--card:#fff;--line:#d8dee6;--text:#1b2733;--muted:#5d6b7a;--ok:#1d8a4e;--ok-l:#e3f5ea;--warn:#b7791f;--warn-l:#fdf3e1;--bad:#c0392b;--bad-l:#fbe9e7;--ai:#5b3cc4;--ai-l:#efeafd}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--text);background:var(--bg)}
a{color:var(--teal)}h1,h2,h3,h4{margin:0 0 .5em}h1{font-size:22px}h2{font-size:18px}h3{font-size:15px}h4{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.topbar{display:flex;align-items:center;gap:24px;background:var(--navy);color:#fff;padding:0 18px;height:56px;position:sticky;top:0;z-index:20}
.brand{display:flex;gap:10px;align-items:center}.logo{width:34px;height:34px;border-radius:7px;background:var(--teal);display:grid;place-items:center;font-weight:700}
.brand-title{font-weight:700;font-size:15px}.brand-sub{font-size:11px;opacity:.75}
nav{display:flex;gap:2px;flex:1}nav a{color:#cfe0f1;text-decoration:none;padding:17px 12px;font-weight:500;border-bottom:3px solid transparent}nav a:hover{color:#fff}nav a.active{color:#fff;border-bottom-color:#4fd1c5}
.top-right{display:flex;gap:10px;align-items:center}.synthetic-pill{background:#f6c343;color:#3d2c00;font-weight:800;font-size:11px;padding:4px 9px;border-radius:12px;letter-spacing:.05em}
.mode{display:flex;gap:6px;align-items:center;font-size:12px}.mode select{font-size:12px;padding:4px;border-radius:5px}
.banner{background:#fff8e1;border-bottom:1px solid #f0dca0;color:#6b5000;font-size:12px;padding:6px 18px}
main{padding:16px 18px 40px}.loading{padding:40px;color:var(--muted)}
.btn{background:var(--teal);color:#fff;border:0;border-radius:6px;padding:7px 13px;font-weight:600;cursor:pointer;font-size:13px}.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;border:1px solid #8fb3d1;color:inherit}.btn.small{padding:4px 9px;font-size:12px}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.warn{background:#9a6b12}.btn.ai{background:var(--ai)}.btn.light{background:#fff;color:var(--text);border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#f4f6f9;font-size:12px;color:var(--muted);font-weight:600}
tr.click{cursor:pointer}tr.click:hover td{background:#f2fafb}
.pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:700}.p-ok{background:var(--ok-l);color:var(--ok)}.p-bad{background:var(--bad-l);color:var(--bad)}.p-warn{background:var(--warn-l);color:var(--warn)}.p-ai{background:var(--ai-l);color:var(--ai)}.p-grey{background:#eceff3;color:#4a5866}.p-teal{background:var(--teal-l);color:var(--teal)}
.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.mt{margin-top:12px}.mb{margin-bottom:12px}
/* ClaimCenter-style claim screen */
.claimbar{background:var(--navy2);color:#fff;border-radius:8px 8px 0 0;padding:10px 14px;display:flex;gap:26px;flex-wrap:wrap;align-items:center}.claimbar .k{font-size:11px;opacity:.7}.claimbar .v{font-weight:600}
.claimbar .cn{font-size:17px;font-weight:700}
.claimwrap{display:grid;grid-template-columns:190px minmax(0,1fr) 520px;gap:0;background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;min-height:calc(100vh - 190px)}
.sidemenu{background:#f4f6f9;border-right:1px solid var(--line);padding:8px 0}.sidemenu a{display:block;padding:8px 14px;color:var(--text);text-decoration:none;font-size:13px}.sidemenu a.active{background:#fff;border-left:3px solid var(--teal);font-weight:600}.sidemenu .sec{font-size:11px;color:var(--muted);padding:12px 14px 4px;text-transform:uppercase;letter-spacing:.05em}
.content{padding:14px;min-width:0}.copilot{border-left:1px solid var(--line);background:#faf9ff;padding:12px;overflow:auto;max-height:calc(100vh - 190px);position:sticky;top:56px}
.copilot-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}.copilot-h .spark{width:26px;height:26px;border-radius:6px;background:var(--ai);color:#fff;display:grid;place-items:center;font-weight:800}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:6px}.skills button{background:#fff;border:1px solid #d5cdf3;border-radius:6px;padding:7px 8px;text-align:left;cursor:pointer;font-size:12.5px;color:var(--text)}.skills button:hover{background:var(--ai-l)}.skills button b{display:block;font-size:12.5px}
.kv{display:grid;grid-template-columns:170px 1fr;gap:4px 12px}.kv div:nth-child(odd){color:var(--muted)}
.doclist{display:grid;grid-template-columns:240px 1fr;gap:12px}.doclist .item{padding:8px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;cursor:pointer;background:#fff}.doclist .item.active{border-color:var(--teal);background:var(--teal-l)}
.docview{white-space:pre-wrap;background:#fcfcfd;border:1px solid var(--line);border-radius:6px;padding:12px;font-size:13px}mark{background:#fff0a8;padding:0 1px}mark.inj{background:#ffd1cc;outline:1px dashed var(--bad)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.photo{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}.photo .ph{height:110px;background:repeating-linear-gradient(45deg,#dfe6ee,#dfe6ee 10px,#e9eef4 10px,#e9eef4 20px);display:grid;place-items:center;color:#7a8a9b;font-size:12px}.photo .cap{padding:6px 8px;font-size:12px}
/* AI output cards */
.aicard{background:#fff;border:1px solid #d5cdf3;border-radius:8px;margin-top:10px;overflow:hidden}.aicard .hd{background:var(--ai-l);padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:6px}.aicard .bd{padding:10px}.aicard .ft{border-top:1px solid #ece8f8;padding:8px 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:#fdfcff}
.stmt{margin:0 0 6px;padding-left:12px;border-left:3px solid #c9bdf2}.cite{display:inline-block;background:#eef3ff;color:#2952a3;border:1px solid #c9d7f5;border-radius:4px;font-size:11px;padding:0 5px;margin-left:3px;cursor:pointer;text-decoration:none}.cite:hover{background:#dce7ff}
.finding{border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:6px}.finding .q{font-size:12px;color:#3d4b59;background:#f7f8fa;border-left:3px solid #9fb4c8;padding:4px 8px;margin-top:4px}
.decision-big{font-size:15px;font-weight:700;margin-bottom:6px}
.letter{white-space:pre-wrap;background:#fffefb;border:1px solid #eadfc8;padding:10px;border-radius:6px;font-family:Georgia,serif;font-size:13px}
textarea{width:100%;min-height:140px;font:inherit;font-size:13px;padding:8px;border:1px solid var(--line);border-radius:6px}input[type=text],input[type=number]{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px}
.hood{background:#0f1b2b;color:#d6e2f0;padding:10px;font-size:12px}.hood h4{color:#8fb0d3}.hood .step{display:grid;grid-template-columns:78px 1fr 60px;gap:8px;padding:5px 0;border-bottom:1px solid #1f3149}.hood .t{font-weight:700;text-transform:uppercase;font-size:10px;padding:2px 5px;border-radius:4px;text-align:center;height:fit-content}
.t-tool{background:#1c4b7a}.t-guardrail{background:#7a3a1c}.t-model{background:#4b2f9a}.t-retrieval{background:#1c6a5e}.t-check{background:#55621c}.t-hitl{background:#8a1c5c}.t-step{background:#38475a}
.hood .st-BLOCKED{color:#ff8a7a;font-weight:700}.hood .st-pass,.hood .st-ok{color:#7ee2a8}.hood .st-warn,.hood .st-fallback{color:#ffd27a}.hood pre{white-space:pre-wrap;background:#0a1320;padding:8px;border-radius:5px;max-height:160px;overflow:auto;color:#b9cbe0}
.alert{border-radius:6px;padding:8px 10px;margin-bottom:8px;font-size:13px}.alert.bad{background:var(--bad-l);border:1px solid #efb7af;color:#7c1f14}.alert.ok{background:var(--ok-l);border:1px solid #a8dcbc;color:#145c34}.alert.warn{background:var(--warn-l);border:1px solid #efd39d;color:#6b4708}.alert.ai{background:var(--ai-l);border:1px solid #d5cdf3}
.status-line{font-size:12px;margin-top:6px}
/* quality */
.gate{display:flex;align-items:center;gap:16px;padding:16px;border-radius:8px;color:#fff}.gate.PASS{background:linear-gradient(90deg,#1d8a4e,#2aa564)}.gate.FAIL{background:linear-gradient(90deg,#b0352a,#d4553f)}.gate .big{font-size:30px;font-weight:800}
.metric{display:grid;grid-template-columns:70px 1fr 90px 90px 60px;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}.metric .val{font-weight:700;font-size:15px}
details summary{cursor:pointer}details .det{padding:6px 10px 10px 80px;font-size:12px}
.kpi{display:flex;flex-direction:column;gap:4px}.kpi .v{font-size:22px;font-weight:700}.illus{font-size:10px;font-weight:800;color:#8a5a00;background:#fff3cd;border:1px solid #f0dca0;padding:1px 6px;border-radius:8px;letter-spacing:.04em}
/* architecture */
.arch{display:grid;grid-template-columns:1fr 60px 1.25fr 60px 1fr;align-items:stretch;gap:0}.arch .col{display:flex;flex-direction:column;gap:10px}.abox{border:2px solid var(--navy2);border-radius:8px;padding:10px;background:#fff}.abox.ai{border-color:var(--ai);background:#fbfaff}.abox.gw{border-color:var(--teal);background:#f3fbfb}.abox.h{border-color:#8a1c5c;background:#fff7fb}.abox .ttl{font-weight:700;margin-bottom:4px}.abox ul{margin:0;padding-left:18px;font-size:12.5px}
.arrow{display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:11px;color:var(--muted);text-align:center}.arrow span{font-size:24px;color:var(--navy2)}
#toast{position:fixed;bottom:18px;right:18px;background:#1b2733;color:#fff;padding:10px 14px;border-radius:8px;opacity:0;transition:.3s;max-width:420px;z-index:50}#toast.show{opacity:1}
.spin{display:inline-block;width:12px;height:12px;border:2px solid #c9bdf2;border-top-color:var(--ai);border-radius:50%;animation:s .7s linear infinite;vertical-align:middle}@keyframes s{to{transform:rotate(360deg)}}
.event-env{background:#0f1b2b;color:#b9cbe0;border-radius:6px;padding:8px;font-size:11.5px;white-space:pre-wrap;max-height:220px;overflow:auto}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;background:#eceff3;margin-right:4px}
/* Password gate – same pattern as the TelForce demo. Shown before the app is decrypted. */
body.locked{background:radial-gradient(1000px 520px at 12% -10%,rgba(79,209,197,.28),transparent 60%),radial-gradient(900px 560px at 110% 110%,rgba(14,124,134,.5),transparent 55%),linear-gradient(145deg,#071a30,#0b2a4a 55%,#0e7c86);min-height:100vh}
body.locked #app{display:none}
#gate{--ink2:#334766;--mut:#5f6f86;--line:#e2e8f0;--brand:#0e7c86;--bad:#c0392b;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate-card{width:100%;max-width:440px;background:#fff;border-radius:20px;padding:34px 34px 22px;box-shadow:0 30px 80px rgba(0,10,30,.45);animation:rise .5s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.gate-brand{display:flex;align-items:center;gap:12px}
.gate-brand .logo{width:42px;height:42px;border-radius:10px;font-size:16px}
.gate-brand .ca-name{font-size:26px;font-weight:750;letter-spacing:-.02em;color:#0b2a4a}
.gate-card h2{font-size:22px;margin:22px 0 4px;color:#0b2a4a}
.gate-sub{color:var(--mut);margin:0 0 18px;font-size:13.5px}
#gate-form label{font-size:12px;font-weight:600;color:var(--ink2);display:block;margin-bottom:6px}
.gate-row{display:flex;gap:8px}
#gate-pw{flex:1;min-width:0;font:inherit;font-size:15px;padding:11px 13px;border:1.5px solid #c9d4e3;border-radius:10px;outline:0;transition:border-color .15s,box-shadow .15s}
#gate-pw:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(14,124,134,.18)}
#gate-pw.bad{border-color:var(--bad);box-shadow:0 0 0 4px rgba(192,57,43,.12);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#gate-btn{white-space:nowrap;font:inherit;font-weight:650;font-size:14px;border:0;border-radius:10px;padding:0 18px;background:linear-gradient(180deg,#14919c,#0e7c86);color:#fff;cursor:pointer;box-shadow:0 2px 8px rgba(14,124,134,.35)}
#gate-btn:hover{background:#0b656d}#gate-btn:disabled{opacity:.7;cursor:wait}
#gate-err{min-height:20px;color:var(--bad);font-size:13px;margin:8px 0 0;font-weight:500}
.gate-foot{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;display:flex;flex-direction:column;gap:3px}
.gate-foot span{font-size:11.5px;color:var(--mut)}
.top-right .btn.ghost{color:#fff;border-color:rgba(255,255,255,.35)}
</style></head>
