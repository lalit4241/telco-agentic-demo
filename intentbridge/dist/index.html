<style>:root{--ink:#0b1f3a;--ink2:#334766;--mut:#5f6f86;--line:#e2e8f0;--line2:#edf1f6;--bg:#f3f6fb;--card:#fff;--brand:#0176D3;--brand-d:#014486;--navy:#032D60;--sky:#90D0FE;--brand2:#eaf5fe;--ok:#2e844a;--okb:#e7f6ec;--warn:#a96404;--warnb:#fef4e4;--bad:#ba0517;--badb:#feeded;--a2a:#7526c7;--a2ab:#f3ebfc;--r:14px;--sh:0 1px 2px rgba(3,45,96,.06),0 4px 14px rgba(3,45,96,.06);--sh2:0 2px 6px rgba(3,45,96,.08),0 12px 32px rgba(3,45,96,.10);font-size:14px}
*{box-sizing:border-box}button,input,select,textarea{font-family:inherit}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.45}

/* ---------- Password gate ---------- */
body.locked{background:radial-gradient(1200px 600px at 15% -10%,rgba(144,208,254,.35),transparent 60%),radial-gradient(900px 600px at 110% 110%,rgba(1,118,211,.55),transparent 60%),linear-gradient(135deg,#021d3f,#032D60 55%,#0b4f9c);min-height:100vh}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate-card{width:100%;max-width:440px;background:#fff;border-radius:20px;padding:34px 34px 22px;box-shadow:0 30px 80px rgba(0,10,30,.45);animation:rise .5s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.gate-brand svg{width:300px;height:auto;display:block}
.gate-card h2{font-size:22px;margin:22px 0 4px}
.gate-sub{color:var(--mut);margin:0 0 18px;font-size:13.5px}
#gate-form label{font-size:12px;font-weight:600;color:var(--ink2);display:block;margin-bottom:6px}
.gate-row{display:flex;gap:8px}
#gate-pw{flex:1;min-width:0;font:inherit;font-size:15px;padding:11px 13px;border:1.5px solid #c9d4e3;border-radius:10px;outline:0;transition:border-color .15s,box-shadow .15s}
#gate-pw:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(1,118,211,.15)}
#gate-pw.bad{border-color:var(--bad);box-shadow:0 0 0 4px rgba(186,5,23,.10);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#gate-btn{white-space:nowrap;font:inherit;font-weight:650;font-size:14px;border:0;border-radius:10px;padding:0 18px;background:linear-gradient(180deg,#0b82e0,#0176D3);color:#fff;cursor:pointer;box-shadow:0 2px 8px rgba(1,118,211,.35)}
#gate-btn:hover{background:#014486}#gate-btn:disabled{opacity:.7;cursor:wait}
#gate-err{min-height:20px;color:var(--bad);font-size:13px;margin:8px 0 0;font-weight:500}
.gate-foot{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;display:flex;flex-direction:column;gap:3px}
.gate-foot span{font-size:11.5px;color:var(--mut)}

/* ---------- Hero header ---------- */
.hero{position:relative;color:#fff;padding:18px 28px 16px;background:radial-gradient(700px 260px at 85% -40%,rgba(144,208,254,.35),transparent 70%),radial-gradient(600px 300px at 0% 140%,rgba(1,118,211,.6),transparent 70%),linear-gradient(120deg,#021d3f 0%,#032D60 45%,#0a4d97 100%);overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:28px 28px;pointer-events:none}
.hero-top{position:relative;z-index:1;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.tf-lockup{display:flex;align-items:center;gap:14px}
.tf-lockup svg{width:56px;height:56px;border-radius:14px;box-shadow:0 0 0 1px rgba(255,255,255,.2),0 6px 18px rgba(0,0,0,.25)}
.tf-lockup h1{margin:0;font-size:32px;font-weight:780;letter-spacing:-.025em;line-height:1}.tf-lockup h1 em{font-style:normal;color:var(--sky)}
.tagline{margin:5px 0 0;font-size:14px;color:#cfe3f7}
.hero-right{margin-left:auto;display:flex;gap:10px;align-items:center}
.badge-sim{background:rgba(255,209,102,.16);color:#ffd166;border:1px solid rgba(255,209,102,.45);border-radius:999px;padding:4px 11px;font-size:11px;font-weight:650;letter-spacing:.04em;text-transform:uppercase}
button.ghost{font:inherit;font-size:12px;font-weight:600;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:5px 13px;cursor:pointer}button.ghost:hover{background:rgba(255,255,255,.18)}
.hero-chips{position:relative;z-index:1;display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hero-chips span{font-size:11.5px;color:#dceaf8;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:4px 11px}
.hero-chips span:first-child{background:rgba(144,208,254,.16);border-color:rgba(144,208,254,.45);color:#fff;font-weight:600}

/* ---------- Tabs ---------- */
nav.tabs{position:sticky;top:0;z-index:20;display:flex;gap:2px;padding:0 22px;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(3,45,96,.03);flex-wrap:wrap}
nav.tabs button{position:relative;background:transparent;border:0;color:var(--ink2);padding:13px 14px 12px;cursor:pointer;font:inherit;font-size:13.5px;font-weight:550;border-radius:0;transition:color .15s}
nav.tabs button:hover{color:var(--brand)}
nav.tabs button.on{color:var(--brand)}nav.tabs button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--brand)}
nav.tabs button .cnt{background:#e5484d;color:#fff;border-radius:9px;padding:0 6px;margin-left:6px;font-size:11px;font-weight:700}
nav.tabs #btn-reset{margin-left:auto;color:var(--mut);font-weight:500}nav.tabs #btn-reset:hover{color:var(--bad)}

/* ---------- KPI strip ---------- */
.kpis{display:flex;gap:10px;padding:14px 28px;overflow-x:auto;background:linear-gradient(180deg,#fff,#f7f9fc);border-bottom:1px solid var(--line)}
.kpi{min-width:128px;border:1px solid var(--line);border-radius:12px;padding:9px 13px;background:#fff;box-shadow:0 1px 2px rgba(3,45,96,.05);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--brand),var(--sky))}
.kpi b{display:block;font-size:19px;font-weight:720;letter-spacing:-.02em;color:var(--navy)}.kpi small{color:var(--mut);font-size:11px}
.kpi.flash{animation:fl 1.1s}@keyframes fl{from{background:#e3f2ff;box-shadow:0 0 0 3px rgba(1,118,211,.25)}to{background:#fff}}

/* ---------- Footer ---------- */
footer.site-foot{margin-top:18px;background:#021d3f;color:#b9cbe2;padding:22px 28px 26px;font-size:12px}
.foot-brand{display:flex;gap:12px;align-items:center;color:#fff;font-size:13px}.foot-brand span{color:var(--sky);font-size:12px}
.foot-brand svg{width:36px;height:36px;border-radius:9px;flex:none}.foot-brand .credit{color:#9fb4cf;font-size:11.5px}
footer.site-foot p{max-width:1100px;margin:12px 0 0;line-height:1.55;color:#9fb4cf}
main{padding:14px 18px}.tab{display:none}.tab.on{display:block}
.grid3{display:grid;grid-template-columns:270px minmax(320px,1fr) minmax(420px,1.25fr);gap:12px;align-items:start}
@media (max-width:1200px){.grid3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}.card h2{font-size:14px;margin:0 0 8px}.card h3{font-size:13px;margin:10px 0 6px;color:var(--ink2)}
.muted{color:var(--mut)}.small{font-size:12px}
.scen{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
.scen.on{border-color:var(--brand);background:var(--brand2)}.scen b{display:block;font-size:12.5px}.scen small{color:var(--mut)}
.scen .tag{font-size:10px;background:var(--ink);color:#fff;border-radius:4px;padding:1px 5px;margin-right:4px}
button.btn{border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:7px;padding:6px 12px;cursor:pointer;font-size:13px}
button.btn.sec{background:#fff;color:var(--brand)}button.btn.ok{background:var(--ok);border-color:var(--ok)}button.btn.bad{background:#fff;color:var(--bad);border-color:var(--bad)}
button.btn:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
select,input,textarea{font:inherit;border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:#fff;color:var(--ink)}textarea{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.steps{list-style:none;padding:0;margin:8px 0 0}.steps li{padding:5px 6px;border-radius:6px;font-size:12.5px;display:flex;gap:6px;align-items:flex-start}
.steps li .dot{width:16px;height:16px;border-radius:50%;flex:none;margin-top:1px;border:2px solid var(--line);font-size:10px;text-align:center;line-height:12px}
.steps li.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}.steps li.running .dot,.steps li.next .dot{border-color:var(--brand)}
.steps li.waiting .dot{background:var(--warn);border-color:var(--warn)}.steps li.skipped{color:var(--mut);text-decoration:line-through}.steps li.rejected .dot{background:var(--bad);border-color:var(--bad)}
.steps li.next{background:var(--brand2)}.steps li small{display:block;color:var(--mut);font-size:11px}
.stabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}.stabs button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 10px;font-size:12px;cursor:pointer}.stabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.surface{height:560px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fcfcfd}
.chan{font-weight:650;font-size:12px;color:var(--ink2);padding:6px 10px;background:#eef1f6;border-bottom:1px solid var(--line);position:sticky;top:0}
.msg{display:flex;gap:8px;padding:8px 10px;border-bottom:1px solid #f0f2f5}.av{width:28px;height:28px;border-radius:6px;flex:none;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.av.agent{background:#0b5cad}.av.human{background:#2f855a}.av.system{background:#6b778c}.msg .who{font-weight:650;font-size:12.5px}.msg .who small{font-weight:400;color:var(--mut);margin-left:6px}
.msg .txt{font-size:13px;line-height:1.4;white-space:pre-wrap}.mcard{border-left:3px solid var(--brand);background:#f5f8fc;padding:6px 8px;margin-top:5px;border-radius:4px;font-size:12px}.mcard b{display:block}
.disc{font-size:11px;background:var(--warnb);color:var(--warn);border-radius:4px;padding:1px 6px;margin-left:6px}
.surface.coworker{background:#f7f9ff}.surface.claude{background:#fbf9f6}.surface.customer{background:#f6fbf8}
.seqwrap{overflow:auto;max-height:330px;border:1px solid var(--line);border-radius:8px;background:#fff}
.events{max-height:300px;overflow:auto;margin-top:8px}.ev{border:1px solid var(--line);border-radius:7px;margin-bottom:5px;font-size:12px;background:#fff}
.ev summary{padding:5px 8px;cursor:pointer;display:flex;gap:6px;align-items:center;list-style:none}.ev summary::-webkit-details-marker{display:none}
.pill{font-size:10.5px;border-radius:9px;padding:1px 7px;font-weight:600;white-space:nowrap}.p-allow{background:var(--okb);color:var(--ok)}.p-deny{background:var(--badb);color:var(--bad)}.p-escalate{background:var(--warnb);color:var(--warn)}.p-a2a{background:var(--a2ab);color:var(--a2a)}.p-info{background:#eef1f6;color:var(--ink2)}
pre.json{margin:0;padding:8px;background:#0f1729;color:#d6e2ff;font-size:11.5px;overflow:auto;max-height:340px;border-radius:0 0 7px 7px}
table.t{border-collapse:collapse;width:100%;font-size:12.5px}table.t th,table.t td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}table.t th{background:#f3f5f9;font-weight:600;position:sticky;top:0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px}.scope-W{background:var(--okb);color:var(--ok);font-weight:700;text-align:center}.scope-R{background:var(--brand2);color:var(--brand);text-align:center}
.qitem{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:10px;margin-bottom:8px;background:#fff}.qitem.approved{border-left-color:var(--ok);opacity:.85}.qitem.rejected{border-left-color:var(--bad);opacity:.85}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media (max-width:1000px){.g2{grid-template-columns:1fr}}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.calc label{font-size:11.5px;color:var(--ink2);display:flex;flex-direction:column;gap:3px}
.big{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.big div{border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:#fbfcfe}.big b{font-size:22px;display:block}
.bar{margin:6px 0}.bar .lbl{font-size:12px;display:flex;justify-content:space-between}.bar .trk{height:10px;background:#eef1f6;border-radius:5px;overflow:hidden}.bar .fill{height:100%;background:var(--brand)}.bar:first-child .fill{background:#0a3d7a}
.illus{background:var(--warnb);color:var(--warn);border-radius:6px;padding:6px 10px;font-size:12px;margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}.seg button{border:0;background:#fff;padding:5px 12px;cursor:pointer}.seg button.on{background:var(--ink);color:#fff}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.g2>*,.grid3>*{min-width:0}
.g2 .t th,.g2 .t td{padding:4px 6px}

.scen .tag.tf{background:#0b5cad}.tfhero{border-left:4px solid #0b5cad}.tfj h3{font-size:14px}.btn.small{font-size:11px;padding:3px 7px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}.tfhero{margin-bottom:12px}@media (max-width:1000px){.g3{grid-template-columns:1fr}}

/* ---------- Presentation polish (overrides) ---------- */
main{padding:22px 28px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);transition:box-shadow .2s}
.card h2{font-size:15px;font-weight:700;color:var(--navy);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:6px;height:16px;border-radius:3px;background:linear-gradient(var(--brand),var(--sky));flex:none}
.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:14px 0 8px}
.grid3,.g2,.g3{gap:16px}

.scen.on{border-color:var(--brand);background:var(--brand2);box-shadow:inset 3px 0 0 var(--brand)}
.scen .tag{background:var(--navy);border-radius:5px;padding:1px 6px;font-weight:650;letter-spacing:.02em}.scen .tag.tf{background:var(--brand)}
button.btn{border-radius:9px;padding:7px 14px;font-weight:600;background:linear-gradient(180deg,#0b82e0,var(--brand));border-color:var(--brand);box-shadow:0 1px 2px rgba(1,118,211,.3)}
button.btn:hover:not(:disabled){background:var(--brand-d);border-color:var(--brand-d)}
button.btn.sec{background:#fff;color:var(--brand);border-color:#b6d6f3;box-shadow:none}button.btn.sec:hover:not(:disabled){background:var(--brand2);color:var(--brand-d)}
button.btn.ok{background:var(--ok);border-color:var(--ok)}button.btn.bad{background:#fff;color:var(--bad);border-color:#f0b4b9;box-shadow:none}
select,input,textarea{border-radius:8px;border-color:#cfd9e6;padding:6px 9px}select:focus,input:focus,textarea:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(1,118,211,.15)}
.steps li{padding:7px 8px;border-radius:8px}.steps li.next{background:var(--brand2);box-shadow:inset 3px 0 0 var(--brand)}
.stabs button{border-radius:999px;padding:5px 12px;font-weight:550;color:var(--ink2)}.stabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.surface{border-radius:12px;border-color:var(--line)}.chan{background:#f1f5fa;color:var(--navy)}
.av.agent{background:linear-gradient(135deg,var(--brand),var(--navy))}
.mcard{border-left-color:var(--brand);background:#f3f8fd;border-radius:6px}
.seqwrap,.events .ev{border-radius:10px}
.pill{padding:2px 8px}
pre.json{background:#071a33;color:#cfe3ff;border-radius:0 0 9px 9px}
table.t th{background:#f4f7fb;color:var(--ink2);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}table.t tr:hover td{background:#fafcff}
.qitem{border-radius:12px;box-shadow:var(--sh)}
.big div{border-radius:12px;background:#fff;box-shadow:var(--sh)}.big b{color:var(--navy)}
.bar .trk{height:10px;border-radius:6px}.bar .fill{background:linear-gradient(90deg,var(--brand),var(--sky))}.bar:first-child .fill{background:linear-gradient(90deg,var(--navy),var(--brand))}
.seg{border-radius:9px}.seg button.on{background:var(--navy)}
.illus{border-radius:9px}

.tfhero h2{color:#fff;font-size:20px}.tfhero h2::before{background:var(--sky)}.tfhero p{color:#dceaf8;font-size:13.5px;max-width:980px}.tfhero b{color:#fff}

        var s = document.createElement('script'); s.textContent = app.js; document.body.appendChild(s);
        $('gate').remove(); document.body.classList.remove('locked');
        var lock = $('btn-lock'); if (lock) lock.onclick = function () { sessionStorage.removeItem(KEYSTORE); location.reload(); };
      });
  }
  var saved = sessionStorage.getItem(KEYSTORE);
  if (saved) open(b64(saved)).catch(function () { sessionStorage.removeItem(KEYSTORE); });
  if (!window.crypto || !crypto.subtle) err('This browser cannot unlock the demo (WebCrypto unavailable). Open it over https or from a local file in a modern browser.');
  $('gate-form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var pw = $('gate-pw').value; err(''); $('gate-btn').disabled = true; $('gate-btn').textContent = 'Unlocking…';
    var done = function () { $('gate-btn').disabled = false; $('gate-btn').textContent = 'Unlock demo'; };
    crypto.subtle.digest('SHA-256', enc.encode(P.hsalt + pw)).then(function (h) {
      if (hex(h) !== P.hash) { done(); err('That password is not right. Please try again.'); $('gate-pw').select(); return; }
      return rawKey(pw).then(function (raw) {
        return open(raw).then(function () { sessionStorage.setItem(KEYSTORE, tob64(raw)); });
      });
    }).catch(function () { done(); err('Could not unlock the demo. Please try again.'); });
  });
})();
</script>
